# domain-wind 配置模板。
# 复制为 config.local.yaml 填写本地敏感配置（webhook），本文件保留默认值入库。

# 数据源（RSS 用 url；GitHub 趋势榜用 type: github_trending。成交源 NameBio 预留，暂不启用）
sources:
  dnjournal:
    enabled: true
    url: "http://www.dnjournal.com/rss.xml"
  dnwire:
    enabled: true
    url: "https://domainnamewire.com/feed/"
  namepros:
    enabled: true
    url: "https://www.namepros.com/external.php?type=rss2"
  # 非 RSS：每日不限语言趋势榜；仓库名作标题进热词（与其他源一样只抽标题）
  github_trending:
    enabled: true
    type: github_trending
    # url 可省略；默认 https://github.com/trending?since=daily

# 热词分析
analyze:
  baseline_days: 7       # 对比基线天数
  new_min: 2             # 新冒头：今日独立条目提及 ≥ N
  surge_min: 3           # 暴增：今日独立条目提及 ≥ N
  surge_ratio: 3         # 暴增：今日 ≥ 基线日均 × N
  top_k: 15              # 热词最多上报条数
  community_limit: 15    # 报告「社区讨论」最多条数
  min_word_len: 3
  max_word_len: 20
  # 停用词（小写）；也可追加到 data/stopwords.txt（每行一词）
  stopwords:
