# 热词 → 候选域名 → 占用粗检（写入日报第三节）
candidates:
  enabled: true
  tlds: [com]
  max_per_word: 10
  min_hot_count: 1
  prefixes: [get, try, the, my, ai]
  suffixes: [hq, hub, lab, app, ly, ai]
  check_concurrency: 3
  report_free_limit: 30      # 日报「可能可注册」最多条数
  report_taken_sample: 5     # 日报「已注册」抽样条数
  max_total: 60              # 全局候选上限（控制粗检耗时）

# 通知
notify:
  # 企业微信机器人 webhook URL（敏感信息放 config.local.yaml 的 notify.webhook_url）
  webhook_url: ""
  # 当日无热词且无社区内容时是否仍推送（false = 不推送，只落盘报告）
  notify_when_quiet: false
